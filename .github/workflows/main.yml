name: Crear APK Bosque Jurásico

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer juego
        run: |
          mkdir -p extracted app/src/main/assets/game
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip -o "$ZIP" -d extracted
          HTML=$(find extracted -type f -iname '*.html' -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          DIR=$(dirname "$HTML")
          cp -r "$DIR"/. app/src/main/assets/game/
          echo "${HTML#"$DIR"/}" > app/src/main/assets/start_path.txt

      - name: Crear proyecto Android
        run: |
          mkdir -p app/src/main/java/com/bosque/jurasico
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BosqueJurasico"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bosque.jurasico'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.bosque.jurasico'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Bosque Jurásico"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/bosque/jurasico/MainActivity.java <<'EOF'
          package com.bosque.jurasico;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  web.setWebChromeClient(new android.webkit.WebChromeClient());
                  setContentView(web);

                  try {
                      BufferedReader reader = new BufferedReader(
                          new InputStreamReader(getAssets().open("start_path.txt")));
                      String path = reader.readLine();
                      reader.close();
                      web.loadUrl("file:///android_asset/game/" + path);
                  } catch (Exception e) {
                      web.loadData("No se encontró el juego HTML.", "text/html", "UTF-8");
                  }
              }
          }
          EOF

      - name: Compilar APK
        run: |
          gradle --version
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bosque-Jurasico-APK
          path: app/build/outputs/apk/debug/app-debug.apk
